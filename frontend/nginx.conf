# ==============================================================================
# Nginx Configuration for fileshare.sanketrajput.live
# Port 80: ACME Challenge + HTTP to HTTPS Redirect
# Port 443: SSL HTTPS Server Block + SPA Fallback + Reverse Proxy to App
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name fileshare.sanketrajput.live localhost;

    # ACME Challenge Webroot for Let's Encrypt / Certbot Verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fileshare.sanketrajput.live;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 500M;

    # Let's Encrypt SSL Certificate Paths
    ssl_certificate /etc/letsencrypt/live/fileshare.sanketrajput.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fileshare.sanketrajput.live/privkey.pem;

    # SSL Security & Hardening Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA Fallback for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy API Requests to Spring Boot Backend Container
    location /api/ {
        proxy_pass http://app:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Static Assets Cache Control
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Prevent Caching of index.html for SPA deployments
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
