# ==============================================================================
# Nginx Configuration for fileshare.sanketrajput.live
# ==============================================================================

# -----------------------------
# HTTP -> HTTPS Redirect
# -----------------------------
server {
    listen 80;
    listen [::]:80;

    server_name fileshare.sanketrajput.live;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------
# HTTPS Server
# -----------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name fileshare.sanketrajput.live;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 500M;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/fileshare.sanketrajput.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fileshare.sanketrajput.live/privkey.pem;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://app:8080/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static Assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Never cache index.html
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }
}